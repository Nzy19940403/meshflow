name: 🚀 Meshflow Multi-Package Release

on:
  # 1. 自动触发：监听指定路径下 package.json 的变动
  push:
    branches: [main]
    paths:
      - 'utils/core/package.json'
      - 'utils/forms/package.json'
      - 'utils/plugins/logger/package.json'
      - 'utils/plugins/meshPulse/package.json'
      
  # 🌟 2. 手动触发：支持在 GitHub Actions 页面手动点击运行，并选择要强制发布的包
  workflow_dispatch:
    inputs:
      force_core:
        description: '是否强制发布 Core 包?'
        type: boolean
        default: false
      force_forms:
        description: '是否强制发布 Forms 包?'
        type: boolean
        default: false
      force_logger:
        description: '是否强制发布 Logger 包?'
        type: boolean
        default: false
      force_meshPulse:
        description: '是否强制发布 MeshPulse 包?'
        type: boolean
        default: false

jobs:
  # 🔍 过滤器：检测变更文件或接收手动输入
  filter:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
      forms: ${{ steps.changes.outputs.forms }}
      logger: ${{ steps.changes.outputs.logger }}
      meshPulse: ${{ steps.changes.outputs.meshPulse }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            core: 'utils/core/package.json'
            forms: 'utils/forms/package.json'
            logger: 'utils/plugins/logger/package.json'
            meshPulse: 'utils/plugins/meshPulse/package.json'

  # 📦 发布 Core 包
  publish-core:
    needs: filter
    # 只要 package.json 变了，或者手动勾选了 force_core，就执行
    if: ${{ needs.filter.outputs.core == 'true' || inputs.force_core == true }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # 🌟 Trusted Publishing 必须权限
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install && npm run build:lib
      - name: 🚢 Publish Core
        working-directory: ./lib-dist 
        # 使用 --provenance 开启受信任发布
        run: npm publish --access public --provenance

  # 📦 发布 Forms 包
  publish-forms:
    needs: filter
    if: ${{ needs.filter.outputs.forms == 'true' || inputs.force_forms == true }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install && npm run build:lib
      - name: 🚢 Publish Forms
        working-directory: ./lib-form 
        run: npm publish --access public --provenance

  # 📦 发布 Logger 包
  publish-logger:
    needs: filter
    if: ${{ needs.filter.outputs.logger == 'true' || inputs.force_logger == true }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install && npm run build:lib
      - name: 🚢 Publish Logger
        working-directory: ./lib-plugins/logger
        run: npm publish --access public --provenance
  
  # 📦 发布 MeshPulse 包
  publish-meshPulse:
    needs: filter
    if: ${{ needs.filter.outputs.meshPulse == 'true' || inputs.force_meshPulse == true }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install && npm run build:lib
      - name: 🚢 Publish MeshPulse
        working-directory: ./lib-plugins/meshPulse
        run: npm publish --access public --provenance